# Конфигурация круглосуточного бота OpenWrt для умного глазка Xiaobai M1
# Скопируйте этот файл на роутер в /etc/eye-bot.conf (chmod 600 /etc/eye-bot.conf)

# Статический IP и MAC-адрес глазка в домашней сети (зафиксируйте по MAC в DHCP роутера!)
EYE_IP="192.168.1.50"
# Опционально: MAC-адрес глазка для постоянной ARP-записи (мгновенный unicast WoWLAN даже после суток сна)
EYE_MAC=""
EYE_IFACE="br-lan"

# Широковещательный адрес вашей подсети (для надежного WoWLAN даже когда ARP устарел)
EYE_BROADCAST="192.168.1.255"

# Порт веб-портала и параметры WoWLAN (должны совпадать с /app/sd/eye.conf на глазке)
EYE_WEB_PORT="8080"
WOWLAN_PORT="9999"
WOWLAN_KEY="WAKEUP"

# Токен бота и Chat ID (те же, что в /app/sd/eye.conf):
# • Для всей семьи рекомендуется закрытая группа (например TG_CHAT_ID="-1001234567890", бот — Администратор),
#   либо список личных ID через запятую (например TG_CHAT_ID="123456789, 987654321").
# • Узнать ID любого чата/группы можно, написав боту /id.
# ВАЖНО: В /app/sd/eye.conf на самом глазке поставьте TG_POLL_ON_DEVICE=0,
# чтобы опрос кнопок вел только роутер 24/7 без конфликта 409!
TG_BOT_TOKEN=""
TG_CHAT_ID=""

# Опционально: прокси для Telegram (например socks5h://127.0.0.1:1080)
TG_PROXY=""
TG_INTERFACE=""   # опционально: имя интерфейса для запросов к Telegram (например wg0), если прямой доступ заблокирован
TG_API_URL="https://api.telegram.org"

# Сколько секунд ждать пробуждения глазка по Wi-Fi после отправки WoWLAN пакета
WAKE_TIMEOUT_SEC="14"
